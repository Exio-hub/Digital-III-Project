<!doctype html>
<!-- Formulario independiente de respaldo para crear una cuenta. -->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SMD Hub | Crear cuenta</title>
    <link rel="stylesheet" href="Sources/dashboard.css" />
    <link rel="stylesheet" href="Sources/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
  </head>
  <body class="register-page">
    <!-- Contenedor de autenticación con la misma estética del login. -->
    <main class="register-shell">
      <a class="register-logo" href="index.html"
        ><img src="Sources/Logo.svg" alt="" /><span
          >SMD<span>·</span>HUB</span
        ></a
      >
      <section class="register-card">
        <p class="eyebrow">SMD · HUB / REGISTRO</p>
        <h1>Empezá a crear.</h1>
        <p class="register-copy">
          Completá tus datos y elegí el espacio que vas a utilizar.
        </p>
        <!-- Destino provisional; JS decidirá el dashboard según el rol. -->
        <form action="dashboard-student.html">
          <div class="form-row">
            <label
              >Nombre<input required type="text" placeholder="Alex" /></label
            ><label
              >Apellido<input required type="text" placeholder="García"
            /></label>
          </div>
          <label
            >Email institucional<input
              required
              type="email"
              placeholder="tu@email.com"
          /></label>
          <label
            >Contraseña<input
              required
              minlength="8"
              type="password"
              placeholder="Mínimo 8 caracteres"
          /></label>
          <label
            >Rol<select id="role" name="role" required>
              <option value="student">Alumno</option>
              <option value="teacher">Profesor</option>
            </select></label
          >
          <button class="button button-primary full-button" type="submit">
            Crear cuenta ↗
          </button>
        </form>
        <p class="form-hint">
          El acceso de profesor será validado por el sistema en la versión
          conectada.
        </p>
        <a class="modal-switch" href="index.html#login"
          >¿Ya tenés una cuenta? <b>Ingresá</b></a
        >
      </section>
    </main>
  </body>
</html>
